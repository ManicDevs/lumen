{{define "content"}}
<p class="text-sm text-secondary mb-6">Manage and render prompt templates for code review and analysis tasks.</p>

<div class="grid-2">
  <div class="card">
    <div class="card-header"><h3>Available Templates</h3></div>
    <div class="card-body" style="padding:0;">
      {{if .Templates}}
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Name</th><th>Description</th></tr>
          </thead>
          <tbody>
            {{range .Templates}}
            <tr>
              <td><span class="badge badge-brand font-mono">{{.Name}}</span></td>
              <td class="text-sm text-secondary">{{.Description}}</td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
      {{else}}
      <div class="empty-state">
        <p class="text-muted text-sm">No templates available.</p>
      </div>
      {{end}}
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Render Template</h3></div>
    <div class="card-body">
      <form id="prompt-form" onsubmit="return renderPrompt(event)">
        <div class="form-group">
          <label class="form-label">Template</label>
          <select class="form-select" id="prompt-select">
            {{range .Templates}}
            <option value="{{.Name}}">{{.Name}}</option>
            {{end}}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Code</label>
          <textarea class="form-textarea" id="prompt-code" rows="8" placeholder="Paste your code here..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="prompt-btn">Render Prompt</button>
      </form>
    </div>
  </div>
</div>

<div class="card mt-6 hidden" id="prompt-result">
  <div class="card-header">
    <h3>Rendered Output</h3>
    <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('prompt-output').textContent).then(function(){showToast('Copied','info')})">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>
  </div>
  <div class="card-body">
    <div class="code-block" id="prompt-output" style="white-space:pre-wrap;"></div>
  </div>
</div>

<script>
function renderPrompt(e) {
  e.preventDefault();
  var btn = document.getElementById('prompt-btn');
  setLoading(btn, true);

  apiCall('POST', '/api/prompts/render', {
    template: document.getElementById('prompt-select').value,
    code: document.getElementById('prompt-code').value
  }).then(function(d) {
    document.getElementById('prompt-result').classList.remove('hidden');
    document.getElementById('prompt-output').textContent = d.rendered || '';
    showToast('Prompt rendered', 'info');
  }).catch(function(err) {
    showToast('Render failed: ' + err.message, 'error');
  }).finally(function() { setLoading(btn, false); });
  return false;
}
</script>
{{end}}
