{{define "content"}}
<div class="flex items-center gap-3 mb-2">
  <div class="stat-icon info">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
  </div>
  <h2 class="text-lg font-bold">Model Evaluation</h2>
</div>
<p class="text-sm text-secondary mb-6" style="margin-left:3rem;">Compare tuned model against base model with side-by-side evaluation.</p>

<div class="grid-2 mb-8">
  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:0.375rem;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Run Evaluation
      </h3>
      <span class="badge badge-neutral">Compare</span>
    </div>
    <div class="card-body">
      <form id="eval-form" onsubmit="return runEval(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Model A (Tuned)</label>
            <select class="form-select" id="eval-model-a"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Model B (Base)</label>
            <select class="form-select" id="eval-model-b"></select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Prompts <span class="text-muted">(one per line)</span></label>
          <textarea class="form-textarea" id="eval-prompts" rows="4" placeholder="Find bugs in this concurrent Go code.&#10;Identify security issues in this auth handler.&#10;Optimize this hot path for allocations."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="eval-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Start Evaluation
        </button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:0.375rem;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Recent Evaluations
      </h3>
      <button class="btn btn-ghost btn-sm" onclick="loadEvals()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
    </div>
    <div class="card-body" style="padding:0;" id="evals-list">
      <div class="loading"><span class="spinner"></span> Loading...</div>
    </div>
  </div>
</div>

<div class="card hidden" id="eval-detail">
  <div class="card-header">
    <h3 id="eval-detail-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:0.375rem;"><circle cx="12" cy="12" r="10"/></svg>
      Evaluation Results
    </h3>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('eval-detail').classList.add('hidden')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close
    </button>
  </div>
  <div class="card-body" style="padding:0;" id="eval-detail-body"></div>
</div>

<script>
function loadModels() {
  return fetch('/api/models').then(function(r){return r.json();}).then(function(d) {
    var models = d.models || [];
    var selA = document.getElementById('eval-model-a');
    var selB = document.getElementById('eval-model-b');
    selA.innerHTML = '';
    selB.innerHTML = '';
    models.forEach(function(m) {
      var name = m.name || m.model;
      selA.innerHTML += '<option value="' + esc(name) + '">' + esc(name) + '</option>';
      selB.innerHTML += '<option value="' + esc(name) + '">' + esc(name) + '</option>';
    });
    if (models.length > 1) {
      selB.selectedIndex = 1;
    }
    return models;
  });
}

function runEval(e) {
  e.preventDefault();
  var btn = document.getElementById('eval-btn');
  setLoading(btn, true);
  var prompts = document.getElementById('eval-prompts').value.trim().split('\n').filter(function(p){return p.trim();});

  apiCall('POST', '/api/models/eval', {
    model: document.getElementById('eval-model-a').value,
    base_model: document.getElementById('eval-model-b').value,
    prompts: prompts.length ? prompts : undefined
  }).then(function(d) {
    showToast('Evaluation started: ' + d.eval_id, 'info');
    setTimeout(loadEvals, 1000);
  }).catch(function(err) {
    showToast('Eval failed: ' + err.message, 'error');
  }).finally(function() { setLoading(btn, false); });
  return false;
}

function loadEvals() {
  var el = document.getElementById('evals-list');
  el.innerHTML = '<div class="loading"><span class="spinner"></span> Loading...</div>';

  fetch('/api/evals').then(function(r){return r.json();}).then(function(d) {
    var evals = d.evals || [];
    if (evals.length === 0) {
      el.innerHTML = '<div class="empty-state" style="padding:2rem;"><div class="empty-icon">&#x1f9ea;</div><h3>No evaluations yet</h3><p class="text-sm text-muted">Run an evaluation to compare models.</p></div>';
      return;
    }
    evals.sort(function(a,b) { return (b.started_at||'').localeCompare(a.started_at||''); });
    var html = '<table class="table"><thead><tr><th>ID</th><th>Model A</th><th>Model B</th><th>Status</th><th></th></tr></thead><tbody>';
    evals.forEach(function(ev) {
      var statusCls = ev.status === 'completed' ? 'badge-success' : 'badge-info';
      html += '<tr>';
      html += '<td class="cell-mono text-sm">' + esc(ev.id.substring(0,16)) + '</td>';
      html += '<td class="text-sm">' + esc(ev.model_a) + '</td>';
      html += '<td class="text-sm">' + esc(ev.model_b) + '</td>';
      html += '<td><span class="badge ' + statusCls + '">' + esc(ev.status) + '</span></td>';
      html += '<td><button class="btn btn-ghost btn-sm" onclick="showEvalDetail(\'' + esc(ev.id) + '\')">View</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }).catch(function() {
    el.innerHTML = '<div class="alert alert-error">Failed to load evaluations</div>';
  });
}

function showEvalDetail(id) {
  fetch('/api/models/eval/' + id).then(function(r){
    if (!r.ok) throw new Error('Not found');
    return r.json();
  }).then(function(d) {
    var detail = document.getElementById('eval-detail');
    detail.classList.remove('hidden');
    detail.scrollIntoView({behavior:'smooth', block:'start'});
    document.getElementById('eval-detail-title').textContent = esc(d.model_a) + ' vs ' + esc(d.model_b);

    var results = d.results || [];
    if (results.length === 0) {
      document.getElementById('eval-detail-body').innerHTML = '<div class="empty-state"><p class="text-muted">Evaluation still running or no results.</p></div>';
      return;
    }

    var avgA = 0, avgB = 0;
    results.forEach(function(r){ avgA += r.score_a; avgB += r.score_b; });
    avgA = results.length ? (avgA / results.length).toFixed(2) : '0';
    avgB = results.length ? (avgB / results.length).toFixed(2) : '0';

    var html = '<div style="padding:1rem 1.5rem;border-bottom:1px solid var(--border-color);background:var(--slate-50);" class="flex items-center justify-between">';
    html += '<div class="flex items-center gap-4">';
    html += '<div class="text-sm"><span class="text-muted">Avg Score A:</span> <span class="font-mono font-semibold">' + avgA + '</span> <span class="score-bar"><span class="score-bar-fill ' + scoreClass(parseFloat(avgA)) + '" style="width:' + Math.min(100, parseFloat(avgA)*25) + '%"></span></span></div>';
    html += '<div class="text-sm"><span class="text-muted">Avg Score B:</span> <span class="font-mono font-semibold">' + avgB + '</span> <span class="score-bar"><span class="score-bar-fill ' + scoreClass(parseFloat(avgB)) + '" style="width:' + Math.min(100, parseFloat(avgB)*25) + '%"></span></span></div>';
    html += '<div class="text-sm"><span class="text-muted">Prompts:</span> <span class="font-semibold">' + results.length + '</span></div>';
    html += '</div></div>';

    results.forEach(function(r, i) {
      html += '<div style="border-bottom:1px solid var(--border-color);' + (i===results.length-1?'border-bottom:none;':'') + '">';
      html += '<div style="padding:0.75rem 1.5rem;background:var(--slate-50);border-bottom:1px solid var(--border-color);" class="flex items-center justify-between">';
      html += '<span class="text-sm font-semibold" style="max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(r.prompt) + '</span>';
      html += '<div class="flex items-center gap-3">';
      html += '<span class="text-xs font-mono">A: ' + r.score_a.toFixed(2) + '</span>';
      html += '<span class="score-bar" style="width:60px;"><span class="score-bar-fill ' + scoreClass(r.score_a) + '" style="width:' + Math.min(100, r.score_a*25) + '%"></span></span>';
      html += '<span class="text-xs font-mono">B: ' + r.score_b.toFixed(2) + '</span>';
      html += '<span class="score-bar" style="width:60px;"><span class="score-bar-fill ' + scoreClass(r.score_b) + '" style="width:' + Math.min(100, r.score_b*25) + '%"></span></span>';
      html += '<span class="text-xs text-muted">' + r.latency_a_ms + 'ms / ' + r.latency_b_ms + 'ms</span>';
      html += '</div></div>';
      if (r.response_a || r.response_b) {
        html += '<div class="compare-grid" style="margin:0.75rem 1.5rem;">';
        html += '<div class="compare-col"><div class="compare-col-header">' + esc(d.model_a) + ' <span class="text-muted font-normal">' + r.latency_a_ms + 'ms</span></div><div class="compare-col-body">' + esc(r.response_a || '(no response)') + '</div></div>';
        html += '<div class="compare-col"><div class="compare-col-header">' + esc(d.model_b) + ' <span class="text-muted font-normal">' + r.latency_b_ms + 'ms</span></div><div class="compare-col-body">' + esc(r.response_b || '(no response)') + '</div></div>';
        html += '</div>';
      }
      html += '</div>';
    });
    document.getElementById('eval-detail-body').innerHTML = html;
  }).catch(function(err) {
    showToast('Failed to load eval: ' + err.message, 'error');
  });
}

loadModels();
loadEvals();
</script>
{{end}}
