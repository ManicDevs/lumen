{{define "content"}}
<p class="text-sm text-secondary mb-6">Compare tuned model against base model with side-by-side evaluation.</p>

<div class="grid-2 mb-8">
  <div class="card">
    <div class="card-header"><h3>Run Evaluation</h3></div>
    <div class="card-body">
      <form id="eval-form" onsubmit="return runEval(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Model A (Tuned)</label>
            <input type="text" class="form-input" id="eval-model-a" placeholder="lumen-tuned">
          </div>
          <div class="form-group">
            <label class="form-label">Model B (Base)</label>
            <input type="text" class="form-input" id="eval-model-b" placeholder="qwen2.5-coder:3b">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Prompts <span class="text-muted">(one per line)</span></label>
          <textarea class="form-textarea" id="eval-prompts" rows="4" placeholder="Find bugs in this concurrent Go code.&#10;Identify security issues in this auth handler.&#10;Optimize this hot path for allocations."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="eval-btn">Start Evaluation</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Recent Evaluations</h3>
      <button class="btn btn-ghost btn-sm" onclick="loadEvals()">Refresh</button>
    </div>
    <div class="card-body" style="padding:0;" id="evals-list">
      <div class="loading"><span class="spinner"></span> Loading...</div>
    </div>
  </div>
</div>

<div class="card hidden" id="eval-detail">
  <div class="card-header">
    <h3 id="eval-detail-title">Evaluation Results</h3>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('eval-detail').classList.add('hidden')">Close</button>
  </div>
  <div class="card-body" style="padding:0;" id="eval-detail-body"></div>
</div>

<script>
var evalPolling = null;

function runEval(e) {
  e.preventDefault();
  var btn = document.getElementById('eval-btn');
  setLoading(btn, true);
  var prompts = document.getElementById('eval-prompts').value.trim().split('\n').filter(function(p){return p.trim();});

  apiCall('POST', '/api/models/eval', {
    model: document.getElementById('eval-model-a').value,
    base_model: document.getElementById('eval-model-b').value,
    prompts: prompts.length ? prompts : undefined
  }).then(function(d) {
    showToast('Evaluation started: ' + d.eval_id, 'info');
    loadEvals();
  }).catch(function(err) {
    showToast('Eval failed: ' + err.message, 'error');
  }).finally(function() { setLoading(btn, false); });
  return false;
}

function loadEvals() {
  var el = document.getElementById('evals-list');
  el.innerHTML = '<div class="loading"><span class="spinner"></span> Loading...</div>';

  apiCall('GET', '/api/metrics').then(function(text) {
    var evalCount = 0;
    text.split('\n').forEach(function(l) {
      if (l.indexOf('lumen_eval_runs_total') === 0 && l[0] === 'l') {
        evalCount = parseInt(l.split(' ')[1]) || 0;
      }
    });
    return evalCount;
  }).catch(function() { return 0; });
}

function showEvalDetail(id) {
  apiCall('GET', '/api/models/eval/' + id).then(function(d) {
    var detail = document.getElementById('eval-detail');
    detail.classList.remove('hidden');
    document.getElementById('eval-detail-title').textContent = 'Eval: ' + d.model_a + ' vs ' + d.model_b;

    var html = '<div class="table-wrap"><table class="table"><thead><tr><th>Prompt</th><th>' + esc(d.model_a) + ' Score</th><th>' + esc(d.model_b) + ' Score</th><th>Latency A</th><th>Latency B</th></tr></thead><tbody>';
    (d.results || []).forEach(function(r) {
      html += '<tr>';
      html += '<td class="text-sm" style="max-width:200px;">' + esc(r.prompt) + '</td>';
      html += '<td><span class="font-mono">' + r.score_a.toFixed(2) + '</span> <span class="score-bar"><span class="score-bar-fill ' + scoreClass(r.score_a) + '" style="width:' + Math.min(100, r.score_a * 25) + '%"></span></span></td>';
      html += '<td><span class="font-mono">' + r.score_b.toFixed(2) + '</span> <span class="score-bar"><span class="score-bar-fill ' + scoreClass(r.score_b) + '" style="width:' + Math.min(100, r.score_b * 25) + '%"></span></span></td>';
      html += '<td class="text-sm font-mono">' + r.latency_a_ms + 'ms</td>';
      html += '<td class="text-sm font-mono">' + r.latency_b_ms + 'ms</td>';
      html += '</tr>';
      if (r.response_a || r.response_b) {
        html += '<tr><td colspan="5" style="padding:0;">';
        html += '<div class="compare-grid" style="margin:0.5rem 1rem;">';
        html += '<div class="compare-col"><div class="compare-col-header">' + esc(d.model_a) + '</div><div class="compare-col-body">' + esc(r.response_a || '') + '</div></div>';
        html += '<div class="compare-col"><div class="compare-col-header">' + esc(d.model_b) + '</div><div class="compare-col-body">' + esc(r.response_b || '') + '</div></div>';
        html += '</div></td></tr>';
      }
    });
    html += '</tbody></table></div>';
    document.getElementById('eval-detail-body').innerHTML = html;
  }).catch(function(err) {
    showToast('Failed to load eval: ' + err.message, 'error');
  });
}

loadEvals();
</script>
{{end}}
