{{define "content"}}
<div class="flex items-center gap-3 mb-2">
  <div class="stat-icon info">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
  </div>
  <h2 class="text-lg font-bold">Dataset Versions</h2>
</div>
<p class="text-sm text-secondary mb-6" style="margin-left:3rem;">Create, compare, and rollback dataset versions with full lifecycle management.</p>

<div class="tabs mb-6">
  <a href="/datasets" class="tab">Commits</a>
  <a href="/generate" class="tab">Generate</a>
  <a href="/versions" class="tab active">Versions</a>
</div>

<div class="grid-2 mb-8">
  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:0.375rem;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Version
      </h3>
      <span class="badge badge-neutral">Tag</span>
    </div>
    <div class="card-body">
      <form id="version-form" onsubmit="return createVersion(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Tag</label>
            <input type="text" class="form-input" id="ver-tag" placeholder="v1.0.0" required>
            <div class="form-hint">Auto-prefixed with 'v' if missing</div>
          </div>
          <div class="form-group">
            <label class="form-label">Message</label>
            <input type="text" class="form-input" id="ver-msg" placeholder="Initial release">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="ver-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Version
        </button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:0.375rem;"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 3l-7 7"/><path d="M3 3l7 7"/></svg>
        Diff Versions
      </h3>
    </div>
    <div class="card-body">
      <form id="diff-form" onsubmit="return diffVersions(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">From Version</label>
            <input type="text" class="form-input" id="diff-from" placeholder="v1.0.0" required>
          </div>
          <div class="form-group">
            <label class="form-label">To Version</label>
            <input type="text" class="form-input" id="diff-to" placeholder="v1.1.0" required>
          </div>
        </div>
        <button type="submit" class="btn btn-secondary w-full" id="diff-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 3l-7 7"/><path d="M3 3l7 7"/></svg>
          Compare Versions
        </button>
      </form>
    </div>
  </div>
</div>

<div class="card mb-8">
  <div class="card-header">
    <h3>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:0.375rem;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Version History
    </h3>
    <button class="btn btn-ghost btn-sm" onclick="loadVersions()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
  <div class="card-body" style="padding:0;" id="versions-list">
    <div class="loading"><span class="spinner"></span> Loading versions...</div>
  </div>
</div>

<div class="card hidden" id="diff-result">
  <div class="card-header">
    <h3>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:0.375rem;"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 3l-7 7"/><path d="M3 3l7 7"/></svg>
      Diff Result
    </h3>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('diff-result').classList.add('hidden')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close
    </button>
  </div>
  <div class="card-body">
    <div class="code-block" id="diff-output" style="white-space:pre-wrap;"></div>
  </div>
</div>

<script>
function loadVersions() {
  var el = document.getElementById('versions-list');
  el.innerHTML = '<div class="loading"><span class="spinner"></span> Loading versions...</div>';
  fetch('/api/dataset/versions').then(function(r){return r.json();}).then(function(d) {
    var versions = d.versions || [];
    if (!versions || versions.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1f4c1;</div><h3>No versions</h3><p>Create your first version to start tracking.</p></div>';
      return;
    }
    versions.sort(function(a,b) { return (b.created_at||'').localeCompare(a.created_at||''); });
    var html = '<div class="timeline" style="padding:1.5rem 2rem;">';
    versions.forEach(function(v) {
      html += '<div class="timeline-item">';
      html += '<div class="tl-time">' + esc(v.created_at || '') + '</div>';
      html += '<div class="flex items-center justify-between">';
      html += '<div><span class="tl-title font-mono">' + esc(v.tag || v.id) + '</span>';
      if (v.message) html += ' <span class="text-sm text-muted">&mdash; ' + esc(v.message) + '</span>';
      html += '</div>';
      html += '<div class="flex items-center gap-3">';
      html += '<span class="badge badge-neutral">' + (v.datapoints || 0) + ' pts</span>';
      html += '<button class="btn btn-ghost btn-sm" onclick="rollbackVersion(\'' + esc(v.id) + '\',\'' + esc(v.tag || v.id) + '\')">';
      html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';
      html += ' Rollback</button>';
      html += '</div></div></div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }).catch(function(err) {
    el.innerHTML = '<div class="alert alert-error">Failed to load versions: ' + esc(err.message) + '</div>';
  });
}

function createVersion(e) {
  e.preventDefault();
  var btn = document.getElementById('ver-btn');
  setLoading(btn, true);
  apiCall('POST', '/api/dataset/versions', {
    tag: document.getElementById('ver-tag').value,
    message: document.getElementById('ver-msg').value
  }).then(function(d) {
    showToast('Version created: ' + (d.tag || d.id), 'success');
    document.getElementById('ver-tag').value = '';
    document.getElementById('ver-msg').value = '';
    loadVersions();
  }).catch(function(err) {
    showToast('Create failed: ' + err.message, 'error');
  }).finally(function() { setLoading(btn, false); });
  return false;
}

function rollbackVersion(id, tag) {
  if (!confirm('Rollback dataset to version ' + tag + '?')) return;
  apiCall('POST', '/api/dataset/versions/' + id + '/rollback', {}).then(function() {
    showToast('Rolled back to ' + tag, 'success');
    loadVersions();
  }).catch(function(err) {
    showToast('Rollback failed: ' + err.message, 'error');
  });
}

function diffVersions(e) {
  e.preventDefault();
  var btn = document.getElementById('diff-btn');
  setLoading(btn, true);
  var from = document.getElementById('diff-from').value;
  var to = document.getElementById('diff-to').value;
  apiCall('GET', '/api/dataset/versions/' + from + '/diff/' + to).then(function(d) {
    document.getElementById('diff-result').classList.remove('hidden');
    document.getElementById('diff-result').scrollIntoView({behavior:'smooth'});
    document.getElementById('diff-output').textContent = JSON.stringify(d, null, 2);
  }).catch(function(err) {
    showToast('Diff failed: ' + err.message, 'error');
  }).finally(function() { setLoading(btn, false); });
  return false;
}

loadVersions();
</script>
{{end}}
