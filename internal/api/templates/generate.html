{{define "content"}}
<p class="text-sm text-secondary mb-6">Create training data from source code using Ollama models.</p>

<div class="tabs mb-6">
  <a href="/datasets" class="tab">Commits</a>
  <a href="/generate" class="tab active">Generate</a>
  <a href="/versions" class="tab">Versions</a>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-header"><h3>Single Generate</h3></div>
    <div class="card-body">
      <form id="gen-form" onsubmit="return runGenerate(event)">
        <div class="form-group">
          <label class="form-label">Target Path <span class="text-muted">(optional)</span></label>
          <input type="text" class="form-input" id="gen-path" placeholder="/path/to/source/code">
          <div class="form-hint">Source code directory to harvest from</div>
        </div>
        <div class="form-group">
          <label class="form-label">Topic <span class="text-muted">(optional)</span></label>
          <input type="text" class="form-input" id="gen-topic" placeholder="Go concurrency patterns">
          <div class="form-hint">Specific topic to generate data about</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Model</label>
            <select class="form-select" id="gen-model"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Mode</label>
            <select class="form-select" id="gen-mode">
              <option value="single">Single Pass</option>
              <option value="continuous">Continuous (5 iterations)</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="gen-btn">Generate Dataset</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Batch Generate</h3></div>
    <div class="card-body">
      <form id="batch-form" onsubmit="return runBatch(event)">
        <div class="form-group">
          <label class="form-label">Topics <span class="text-muted">(one per line)</span></label>
          <textarea class="form-textarea" id="batch-topics" rows="5" placeholder="SQL injection prevention&#10;Concurrent goroutine patterns&#10;HTTP middleware design" required></textarea>
          <div class="form-hint" id="batch-count">0 topics</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Target Path</label>
            <input type="text" class="form-input" id="batch-path" placeholder="/path/to/source">
          </div>
          <div class="form-group">
            <label class="form-label">Parallel Jobs</label>
            <select class="form-select" id="batch-parallel">
              <option value="2" selected>2</option>
              <option value="4">4</option>
              <option value="8">8</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Model</label>
          <select class="form-select" id="batch-model"></select>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="batch-btn">Run Batch Generation</button>
      </form>
    </div>
  </div>
</div>

<div class="card mt-6 hidden" id="gen-result">
  <div class="card-header">
    <h3>Result</h3>
    <div class="flex items-center gap-2">
      <span class="badge badge-success" id="gen-status">Completed</span>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('gen-result').classList.add('hidden')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="card-body">
    <div class="code-block" id="gen-output"></div>
  </div>
</div>

<script>
function loadModels() {
  return fetch('/api/models').then(function(r){return r.json();}).then(function(d) {
    var models = d.models || [];
    var sels = ['gen-model','batch-model'];
    sels.forEach(function(id) {
      var sel = document.getElementById(id);
      sel.innerHTML = '';
      models.forEach(function(m) {
        var name = m.name || m.model;
        sel.innerHTML += '<option value="' + esc(name) + '">' + esc(name) + '</option>';
      });
    });
  });
}

document.getElementById('batch-topics').addEventListener('input', function() {
  var lines = this.value.trim().split('\n').filter(function(l){return l.trim();});
  document.getElementById('batch-count').textContent = lines.length + ' topic' + (lines.length !== 1 ? 's' : '');
});

function runGenerate(e) {
  e.preventDefault();
  var btn = document.getElementById('gen-btn');
  setLoading(btn, true);
  var body = {
    model: document.getElementById('gen-model').value,
    continuous: document.getElementById('gen-mode').value === 'continuous',
    max_iterations: document.getElementById('gen-mode').value === 'continuous' ? 5 : 1
  };
  var path = document.getElementById('gen-path').value.trim();
  var topic = document.getElementById('gen-topic').value.trim();
  if (path) body.target_path = path;
  if (topic) body.topic = topic;

  apiCall('POST', '/api/datasets/generate', body).then(function(d) {
    document.getElementById('gen-result').classList.remove('hidden');
    document.getElementById('gen-output').textContent = JSON.stringify(d, null, 2);
    showToast('Dataset generated successfully', 'success');
  }).catch(function(err) {
    showToast('Generation failed: ' + err.message, 'error');
  }).finally(function() { setLoading(btn, false); });
  return false;
}

function runBatch(e) {
  e.preventDefault();
  var btn = document.getElementById('batch-btn');
  var topics = document.getElementById('batch-topics').value.trim().split('\n').filter(function(t){return t.trim();});
  if (topics.length === 0) { showToast('Enter at least one topic', 'error'); return false; }
  setLoading(btn, true);
  var jobs = topics.map(function(t) {
    return {
      topic: t.trim(),
      target_path: document.getElementById('batch-path').value.trim() || undefined,
      model: document.getElementById('batch-model').value
    };
  });

  apiCall('POST', '/api/datasets/batch', { jobs: jobs, parallel: parseInt(document.getElementById('batch-parallel').value) }).then(function(d) {
    document.getElementById('gen-result').classList.remove('hidden');
    document.getElementById('gen-output').textContent = JSON.stringify(d, null, 2);
    showToast('Batch generation completed (' + topics.length + ' jobs)', 'success');
  }).catch(function(err) {
    showToast('Batch failed: ' + err.message, 'error');
  }).finally(function() { setLoading(btn, false); });
  return false;
}

loadModels();
</script>
{{end}}
