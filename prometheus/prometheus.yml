global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "lumen"
    static_configs:
      - targets: ["lumen:8080"]
        labels:
          app: "lumen"
          environment: "production"

  - job_name: "ollama"
    static_configs:
      - targets: ["ollama:11434"]
        labels:
          app: "ollama"
          environment: "production"

remote_write:
  - url: ""

remote_read:
  - url: ""